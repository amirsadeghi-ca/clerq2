[project]
name = "clerq2-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
