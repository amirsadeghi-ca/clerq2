[project]
name = "interpret-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.2.0",
    "pyotp>=2.9.0",
    "cryptography>=42.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "freezegun>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
